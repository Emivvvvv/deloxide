<svg xmlns="http://www.w3.org/2000/svg" width="960" height="268" viewBox="0 0 960 268"><title>Focused synchronization latency</title><desc>Median nanoseconds per uncontended operation; lower is better.</desc><rect width="960" height="268" fill="#fff"/><style>text{font:14px sans-serif;fill:#222}</style><text x="20" y="88">deloxide: mutex/uncontended</text><rect x="430" y="70" width="62.84" height="24" fill="#e66a2c"/><text x="502.84" y="88">9.12 ns</text><text x="20" y="130">parking_lot: parking_lot/mutex_uncontended</text><rect x="430" y="112" width="70.80" height="24" fill="#e66a2c"/><text x="510.80" y="130">10.28 ns</text><text x="20" y="172">deloxide: rwlock/read_uncontended</text><rect x="430" y="154" width="400.00" height="24" fill="#e66a2c"/><text x="840.00" y="172">58.07 ns</text><text x="20" y="214">deloxide: rwlock/write_uncontended</text><rect x="430" y="196" width="63.13" height="24" fill="#e66a2c"/><text x="503.13" y="214">9.17 ns</text></svg>
